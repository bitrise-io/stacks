{{ define "main" }}
<article class="markdown">
  <h1>
    <a href="{{ .RelPermalink }}">{{ partial "docs/title.html" . }}</a>
    {{ with partial "stack_report" . }}{{ with .Params.flavor }}{{ partial "stack_chip" . }}{{ end }}{{ end }}
  </h1>
  {{ partial "docs/post-meta" . }}
  {{- partial "changelog_content" . -}}
</article>
{{ end }}

{{ define "toc" }}
  {{ partial "docs/toc" . }}
{{ end }}
